  specliteRoot: _speclite
  artifactRoot: _speclite-output
  manifestPath: _speclite/_config/manifest.yaml
sourceDescriptor:
  sourceType: bundled
  resolvedRoot: assets/source/speclite
  trustStatus: trusted
  integrityEvidence:
