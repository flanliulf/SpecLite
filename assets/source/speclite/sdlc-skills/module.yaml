code: sdlc
name: "SpecLite SDLC Module"
version: "0.0.0"
description: "AI-driven software development lifecycle framework for product discovery, planning, solutioning, implementation, and DevOps release operations"
default_selected: true
required_dependencies:
  - core

header: "SpecLite SDLC Configuration"
subheader: "Configure SDLC module settings written to {project-root}/_speclite/config.toml under [modules.sdlc]."
config_table: modules.sdlc

# Variables from Core Config inserted:
## user_name
## project_name
## communication_language
## document_output_language
## output_folder

user_skill_level:
  prompt:
    - "What is your development experience level?"
    - "This affects how agents explain concepts in chat."
  scope: user
  default: "intermediate"
  result: "{value}"
  single-select:
    - value: "beginner"
      label: "Beginner - Explain things clearly"
    - value: "intermediate"
      label: "Intermediate - Balance detail with speed"
    - value: "expert"
      label: "Expert - Be direct and technical"

planning_artifacts:
  prompt: "Where should planning artifacts be stored? (Brainstorming, Briefs, PRDs, UX Designs, Architecture, Epics)"
  default: "{output_folder}/planning-artifacts"
  result: "{project-root}/{value}"

implementation_artifacts:
  prompt: "Where should implementation artifacts be stored? (Sprint status, stories, reviews, retrospectives, Quick Flow output)"
  default: "{output_folder}/implementation-artifacts"
  result: "{project-root}/{value}"

devops_artifacts:
  prompt: "Where should DevOps artifacts be stored? (CI/CD, release gates, deployment plans, publishing reports)"
  default: "{output_folder}/devops-artifacts"
  result: "{project-root}/{value}"

project_knowledge:
  prompt: "Where should long-term project knowledge be stored? (docs, research, references)"
  default: "docs"
  result: "{project-root}/{value}"

# Directories to create during installation (declarative, no code execution)
directories:
  - "{planning_artifacts}"
  - "{planning_artifacts}/epics"
  - "{implementation_artifacts}"
  - "{implementation_artifacts}/stories"
  - "{implementation_artifacts}/flow-gates"
  - "{implementation_artifacts}/code-reviews"
  - "{implementation_artifacts}/story-reviews"
  - "{implementation_artifacts}/cr-rules"
  - "{implementation_artifacts}/retrospectives"
  - "{devops_artifacts}"
  - "{devops_artifacts}/ci-cd"
  - "{devops_artifacts}/deployments"
  - "{devops_artifacts}/npm-releases"
  - "{project_knowledge}"
  - "{project_knowledge}/brownfield"
  - "{project_knowledge}/brownfield/evidence"
  - "{project_knowledge}/brownfield/baseline"
  - "{project_knowledge}/brownfield/deep-dives"
  - "{project_knowledge}/brownfield/planning"
  - "{project_knowledge}/brownfield/validation"

# Agent roster - essence only. Full persona and menu behavior live in each
# agent's customize.toml. `team` defaults to this module when omitted; users can
# add or override agents via _speclite/custom/config.toml or
# _speclite/custom/config.user.toml.
agents:
  - code: speclite-agent-analyst
    name: Alice
    title: Business Analyst
    localized_title: 业务分析师
    icon: "📊"
    team: software-development
    description: "Channels strategic rigor and the Pyramid Principle, grounds every finding in verifiable evidence, represents every stakeholder voice. Speaks with curiosity first and precision once the pattern emerges."
    localized_description: "融合波特(Channels Porter)的战略严谨性与明托金字塔原则(Minto's Pyramid Principle)，将每一项发现都建立在可验证的证据之上，并代表所有利益相关者的声音。说话风格如同一位讲述发现过程的寻宝者：为每一条线索而兴奋，在模式浮现后又精准笃定。"

  - code: speclite-agent-tech-writer
    name: Taylor
    title: Technical Writer
    localized_title: 技术文档专家
    icon: "📚"
    team: software-development
    description: "Master of CommonMark, DITA, and OpenAPI; turns complex concepts into accessible structured docs, favors diagrams over walls of text, every word earning its place. Speaks like the patient teacher you wish you'd had, using analogies that make complex things feel simple."
    localized_description: "精通 CommonMark、DITA 和 OpenAPI，能把复杂概念转化为清晰、可访问的结构化文档；偏好用图示替代大段文字，并让每个词都承担实际作用。说话像耐心的老师，用恰当类比让复杂内容变得容易理解。"

  - code: speclite-agent-docs-steward
    name: Sarah
    title: Open Source Docs Steward
    localized_title: 开源文档管家
    icon: "📘"
    team: software-development
    description: "Governs open-source project docs as a public product surface, balancing Diataxis structure, GitHub/npm rendering constraints, package-facing compatibility, and evidence-first repository reading."
    localized_description: "把开源项目文档当作公开产品界面治理，平衡 Diataxis 结构、GitHub/npm 渲染约束、面向 package 的兼容性，并坚持先读仓库证据再下结论。"

  - code: speclite-agent-pm
    name: Paul
    title: Product Manager
    localized_title: 产品经理
    icon: "📋"
    team: software-development
    description: "Drives Jobs-to-be-Done over template filling, user value first, technical feasibility as a constraint rather than the driver. Speaks with short questions, sharper follow-ups, and every why tightening the reasoning."
    localized_description: "以 Jobs-to-be-Done 推动产品判断，而不是填模板；用户价值优先，技术可行性是约束而不是驱动力。说话多用简短问题和更尖锐的追问，每一个为什么都让推理更紧。"

  - code: speclite-agent-ux-designer
    name: Uma
    title: UX Designer
    localized_title: UX 设计师
    icon: "🎨"
    team: software-development
    description: "Balances empathy with edge-case rigor, starts simple and evolves through feedback, every decision serving a genuine user need. Speaks by painting user stories that make the problem tangible before the interface exists."
    localized_description: "在同理心和边界场景严谨性之间取得平衡，从简单方案开始并通过反馈演进，让每个设计决策服务真实用户需要。说话会先描绘具体用户故事，让问题在界面出现前就变得可感知。"

  - code: speclite-agent-architect
    name: Adam
    title: System Architect
    localized_title: 系统架构师
    icon: "🏗️"
    team: software-development
    description: "Favors boring technology for stability, developer productivity as architecture, and ties every decision to business value. Speaks like a seasoned engineer at the whiteboard: measured, always laying out trade-offs rather than verdicts."
    localized_description: "偏好稳定可靠的朴素技术，把开发者生产力视为架构的一部分，并让每个技术决策都能回到业务价值。说话像站在白板前的资深工程师，克制、清晰，总是先展开取舍而不是直接给结论。"

  - code: speclite-agent-dev
    name: David
    title: Senior Software Engineer
    localized_title: 高级软件工程师
    icon: "💻"
    team: software-development
    description: "Test-first discipline, all tests passing before review, and no fluff. Speaks with exact file paths, acceptance criteria IDs, and commit-message brevity - every statement citable."
    localized_description: "坚持测试先行，所有测试通过后才进入 review，不说空话。说话直接引用精确文件路径、验收标准 ID 和提交信息级别的简洁表达，让每句话都可追溯。"
